{% extends "base.html" %}

{% block title %}Submit Operational Issue - CampusSync{% endblock %}

{% block content %}
<div class="form-container">
    <div class="card">
        <div style="margin-bottom: 1.5rem;">
            <h2>Submit Operational Issue</h2>
            <p class="page-subtitle">Describe the problem below. Requests are automatically routed to the responsible department.</p>
        </div>

        <form method="post" action="{{ url_for('routes.faculty_submit_issue') }}">
            <div class="form-group">
                <label for="problem">Problem Title *</label>
                <input type="text" id="problem" name="problem" class="form-control" value="{{ problem or '' }}" placeholder="e.g. Classroom projector lamp flickering" required>
            </div>
            
            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" class="form-control" required>
                    <option value="">-- Select Category --</option>
                    {% for cat in categories %}
                        <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="room_number">Room Number *</label>
                <input type="text" id="room_number" name="room_number" class="form-control" value="{{ room_number or '' }}" placeholder="e.g. Science Building 204" required>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <textarea id="description" name="description" class="form-control" rows="4" placeholder="Provide additional details, error codes, or context..."></textarea>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.75rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                <button type="submit" class="btn btn-primary">Submit Issue</button>
                <a href="{{ url_for('routes.faculty_dashboard') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
