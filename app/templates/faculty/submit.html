{% extends "base.html" %}

{% block title %}Submit Operational Issue - CampusSync{% endblock %}

{% block content %}
<h2>Submit Operational Issue</h2>

<form method="post" action="{{ url_for('routes.faculty_submit_issue') }}">
    <div>
        <label for="problem">Problem Title *</label><br>
        <input type="text" id="problem" name="problem" value="{{ problem or '' }}" required>
    </div>
    <br>
    <div>
        <label for="category">Category *</label><br>
        <select id="category" name="category" required>
            <option value="">-- Select Category --</option>
            {% for cat in categories %}
                <option value="{{ cat }}" {% if category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
        </select>
    </div>
    <br>
    <div>
        <label for="room_number">Room Number *</label><br>
        <input type="text" id="room_number" name="room_number" value="{{ room_number or '' }}" required>
    </div>
    <br>
    <div>
        <label for="description">Description</label><br>
        <textarea id="description" name="description" rows="4" cols="50">{{ description or '' }}</textarea>
    </div>
    <br>
    <div>
        <button type="submit">Submit Issue</button>
        <a href="{{ url_for('routes.faculty_dashboard') }}">Cancel</a>
    </div>
</form>
{% endblock %}
