{% extends "base.html" %}

{% block title %}Login - CampusSync{% endblock %}

{% block content %}
<div style="max-width: 380px; margin: 4rem auto 0;">
    <div class="card" style="padding: 2rem;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h2>Login</h2>
        </div>
        <form method="post">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" class="form-control" placeholder="e.g. faculty@campussync.edu" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="e.g. password123" required>
            </div>
            <div style="margin-top: 1.75rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem;">Sign In</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
